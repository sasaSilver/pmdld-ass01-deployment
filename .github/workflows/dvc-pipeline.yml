name: DVC Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dvc-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important for DVC to work properly
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: uv sync --all-extras
    
    - name: Configure DVC
      run: |
        dvc remote modify myremote --local auth_service_account_json_path ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
    
    - name: Pull data from DVC remote
      run: |
        dvc pull
    
    - name: Run DVC pipeline
      run: |
        dvc repro
    
    - name: Push results to DVC remote
      run: |
        dvc push
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add dvc.lock metrics/ params.yaml
        git diff --staged --quiet || git commit -m "Update DVC pipeline results [skip ci]"
        git push
    
    - name: Upload metrics as artifact
      uses: actions/upload-artifact@v4
      with:
        name: model-metrics
        path: metrics/
        retention-days: 30

